name: Promote validated 1.0.1 source

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/mimic-init-flat-particle
          fetch-depth: 0

      - name: Promote validated source changes
        shell: bash
        run: |
          test -f ci-fix.py
          python3 ci-fix.py

          # The temporary Gradle bootstrap was only needed to validate the
          # transformation before committing it. Restore the normal build file.
          git show origin/main:build.gradle > build.gradle

          rm -f .ci-fix-1.0.1-applied
          git rm -f ci-fix.py ci-1.0.1-trigger.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build.gradle gradle.properties \
            src/main/java/com/provismet/cursedspawners/entity/SpawnerMimicEntity.java \
            src/main/java/com/provismet/cursedspawners/client/particle/AOEChargingParticle.java
          git commit -m 'Fix mimic initialization crash and restore flat AOE particle'
          git push origin HEAD:fix/mimic-init-flat-particle

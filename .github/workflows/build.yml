name: Forge 1.20.1 Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build
        run: gradle --no-daemon build --stacktrace

      - name: Dedicated server + Spawner Mimic smoke test
        shell: bash
        run: |
          mkdir -p run
          echo 'eula=true' > run/eula.txt
          cat > run/server.properties <<'EOF'
          enable-rcon=true
          rcon.port=25575
          rcon.password=cursed-spawners-ci
          online-mode=false
          server-port=25565
          level-name=world
          EOF

          set +e
          timeout --signal=INT 120s gradle --no-daemon runServer > server-smoke.log 2>&1 &
          SERVER_PID=$!
          set -e

          ready=0
          for i in $(seq 1 90); do
            if grep -Eq 'Done \([0-9.]+s\)!' server-smoke.log; then
              ready=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            tail -n 160 server-smoke.log
            echo 'Dedicated server never reached the ready state.'
            exit 1
          fi

          python3 - <<'PY'
          import socket, struct, time

          HOST = '127.0.0.1'
          PORT = 25575
          PASSWORD = 'cursed-spawners-ci'

          def send_packet(sock, request_id, packet_type, body):
              payload = struct.pack('<ii', request_id, packet_type) + body.encode('utf-8') + b'\x00\x00'
              sock.sendall(struct.pack('<i', len(payload)) + payload)

          def recv_packet(sock):
              raw_len = sock.recv(4)
              if len(raw_len) != 4:
                  raise RuntimeError('RCON connection closed before packet length')
              length = struct.unpack('<i', raw_len)[0]
              data = b''
              while len(data) < length:
                  chunk = sock.recv(length - len(data))
                  if not chunk:
                      raise RuntimeError('RCON connection closed mid-packet')
                  data += chunk
              request_id, packet_type = struct.unpack('<ii', data[:8])
              return request_id, packet_type, data[8:-2].decode('utf-8', errors='replace')

          deadline = time.time() + 20
          sock = None
          while time.time() < deadline:
              try:
                  sock = socket.create_connection((HOST, PORT), timeout=3)
                  break
              except OSError:
                  time.sleep(0.5)
          if sock is None:
              raise RuntimeError('RCON did not become available')

          with sock:
              send_packet(sock, 1, 3, PASSWORD)
              auth_id, _, auth_body = recv_packet(sock)
              if auth_id == -1:
                  raise RuntimeError('RCON authentication failed')

              send_packet(sock, 2, 2, 'summon cursed-spawners:spawner_mimic 0 100 0')
              _, _, summon = recv_packet(sock)
              print('SUMMON:', summon)
              if 'Summoned' not in summon:
                  raise RuntimeError('Spawner Mimic summon command did not succeed: ' + summon)

              # Let the integrated entity tick path run; the 1.0.0 constructor bug
              # crashed immediately during creation, before this point.
              time.sleep(2)
              send_packet(sock, 3, 2, 'data get entity @e[type=cursed-spawners:spawner_mimic,limit=1]')
              _, _, entity_data = recv_packet(sock)
              print('ENTITY:', entity_data[:500])
              if not entity_data:
                  raise RuntimeError('Spawner Mimic was not queryable after ticking')

              send_packet(sock, 4, 2, 'stop')
              try:
                  _, _, stopped = recv_packet(sock)
                  print('STOP:', stopped)
              except Exception:
                  pass
          PY

          set +e
          wait "$SERVER_PID"
          status=$?
          set -e
          tail -n 160 server-smoke.log
          if grep -Eq 'Failed to start the minecraft server|MixinApplyError|MixinTransformerError|NullPointerException|Caught exception from cursed_spawners' server-smoke.log; then
            echo 'A fatal mod/server runtime error was found in the smoke-test log.'
            exit 1
          fi
          echo "Dedicated Forge server created and ticked a Spawner Mimic successfully (process exit $status)."

      - name: Headless client smoke test
        shell: bash
        run: |
          command -v xvfb-run >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y xvfb; }
          rm -f run/logs/latest.log client-smoke.log
          set +e
          LIBGL_ALWAYS_SOFTWARE=1 timeout --signal=INT 120s xvfb-run -a gradle --no-daemon runClient > client-smoke.log 2>&1
          status=$?
          set -e
          if [ -f run/logs/latest.log ]; then
            cat run/logs/latest.log >> client-smoke.log
          fi
          tail -n 160 client-smoke.log
          grep -q 'Reloading ResourceManager: vanilla, mod_resources' client-smoke.log
          grep -Eq 'Created: .*minecraft:textures/atlas/blocks.png-atlas' client-smoke.log
          grep -Eq 'Created: .*minecraft:textures/atlas/particles.png-atlas' client-smoke.log
          if grep -Eq 'MixinApplyError|MixinTransformerError|Failed to create window|Exception in thread "Render thread"|Caught exception from cursed_spawners' client-smoke.log; then
            exit 1
          fi
          echo "Headless Forge client reached initialized resource/render state successfully (process exit $status)."

      - name: Validate built jar contents
        shell: bash
        run: |
          JAR="$(find build/libs -maxdepth 1 -name '*.jar' -type f | head -n 1)"
          test -n "$JAR"
          unzip -l "$JAR" > jar-contents.txt
          test "$(grep -c '\.ogg$' jar-contents.txt)" -eq 16
          test "$(grep -c '\.png$' jar-contents.txt)" -eq 24
          grep -q 'textures/entity/spawner_mimic.png$' jar-contents.txt
          grep -q 'sounds/mob/spawner_mimic/death.ogg$' jar-contents.txt
          grep -q '^ *[0-9].* LICENSE$' jar-contents.txt
          grep -q '^ *[0-9].* NOTICE$' jar-contents.txt
          echo "Validated resources and license notices in $JAR"

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: cursed-spawners-forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error

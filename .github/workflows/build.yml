name: Forge 1.20.1 Compile

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source project
        shell: bash
        run: |
          cat ci-project/part-*.txt > project.zip.b64
          base64 --decode project.zip.b64 > project.zip
          mkdir project
          unzip -q project.zip -d project
          test -f project/build.gradle
          sed -i 's/^@@ -354,7 +373,13 @@/@@ -354,7 +373,11 @@/' ci-current.patch
          git apply --directory=project ci-current.patch
          echo "Reconstructed and patched $(find project -type f | wc -l) project files"

      - name: Restore original binary assets
        shell: bash
        run: |
          git clone --quiet --depth 1 --branch 1.0.0-mc1.21 https://github.com/Provismet/Cursed-Spawners.git original-upstream
          cd original-upstream/src/main/resources
          find assets/cursed-spawners -type f \( -name '*.png' -o -name '*.ogg' \) -print0 | while IFS= read -r -d '' file; do
            mkdir -p "$GITHUB_WORKSPACE/project/src/main/resources/$(dirname "$file")"
            cp "$file" "$GITHUB_WORKSPACE/project/src/main/resources/$file"
          done
          test "$(find "$GITHUB_WORKSPACE/project/src/main/resources/assets/cursed-spawners" -name '*.ogg' | wc -l)" -eq 16
          test "$(find "$GITHUB_WORKSPACE/project/src/main/resources/assets/cursed-spawners" -name '*.png' | wc -l)" -eq 24
          echo "Restored $(find "$GITHUB_WORKSPACE/project/src/main/resources/assets/cursed-spawners" \( -name '*.ogg' -o -name '*.png' \) | wc -l) binary assets"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Compile Forge backport
        working-directory: project
        run: gradle --no-daemon build --stacktrace

      - name: Dedicated server smoke test
        shell: bash
        run: |
          mkdir -p project/run
          echo 'eula=true' > project/run/eula.txt
          cd project
          set +e
          timeout --signal=INT 120s gradle --no-daemon runServer > server-smoke.log 2>&1
          status=$?
          set -e
          tail -n 120 server-smoke.log
          if ! grep -Eq 'Done \([0-9.]+s\)!|Done \([0-9.]+s\)! For help' server-smoke.log; then
            echo "Dedicated server never reached the ready state (exit $status)."
            exit 1
          fi
          if grep -Eq 'Failed to start the minecraft server|MixinApplyError|MixinTransformerError|Exception in thread "main"|Caught exception from cursed_spawners' server-smoke.log; then
            echo 'A fatal mod/server startup error was found in the smoke-test log.'
            exit 1
          fi
          echo "Dedicated Forge server reached ready state successfully (process exit $status)."

      - name: Validate built jar contents
        shell: bash
        run: |
          JAR="$(find project/build/libs -maxdepth 1 -name '*.jar' -type f | head -n 1)"
          test -n "$JAR"
          unzip -l "$JAR" > jar-contents.txt
          test "$(grep -c '\.ogg$' jar-contents.txt)" -eq 16
          test "$(grep -c '\.png$' jar-contents.txt)" -eq 24
          grep -q 'textures/entity/spawner_mimic.png$' jar-contents.txt
          grep -q 'sounds/mob/spawner_mimic/death.ogg$' jar-contents.txt
          echo "Validated binary resources in $JAR"

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: cursed-spawners-forge-1.20.1
          path: project/build/libs/*.jar
          if-no-files-found: error

name: Normalize Forge 1.20.1 backport

on:
  pull_request:
  push:

permissions:
  contents: write

jobs:
  normalize:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/forge-compile-fixes'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: agent/forge-compile-fixes
          fetch-depth: 0

      - name: Reconstruct validated project
        shell: bash
        run: |
          cat ci-project/part-*.txt > project.zip.b64
          base64 --decode project.zip.b64 > project.zip
          mkdir project
          unzip -q project.zip -d project
          test -f project/build.gradle
          sed -i 's/^@@ -354,7 +373,13 @@/@@ -354,7 +373,11 @@/' ci-current.patch
          git apply --directory=project ci-current.patch
          git apply --directory=project ci-release-adjustments.patch

      - name: Restore original binary assets
        shell: bash
        run: |
          git clone --quiet --depth 1 --branch 1.0.0-mc1.21 https://github.com/Provismet/Cursed-Spawners.git original-upstream
          cd original-upstream/src/main/resources
          find assets/cursed-spawners -type f \( -name '*.png' -o -name '*.ogg' \) -print0 | while IFS= read -r -d '' file; do
            mkdir -p "$GITHUB_WORKSPACE/project/src/main/resources/$(dirname "$file")"
            cp "$file" "$GITHUB_WORKSPACE/project/src/main/resources/$file"
          done
          test "$(find "$GITHUB_WORKSPACE/project/src/main/resources/assets/cursed-spawners" -name '*.ogg' | wc -l)" -eq 16
          test "$(find "$GITHUB_WORKSPACE/project/src/main/resources/assets/cursed-spawners" -name '*.png' | wc -l)" -eq 24

      - name: Apply final release metadata
        shell: bash
        run: |
          cp ci-final/gradle.properties project/gradle.properties
          cp ci-final/README.md project/README.md
          cp ci-final/NOTICE project/NOTICE
          mkdir -p project/.github/workflows
          cp ci-final/build.yml project/.github/workflows/build.yml

      - name: Replace temporary repository with normal source tree
        shell: bash
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'project' -exec rm -rf {} +
          cp -a project/. .
          rm -rf project
          test -f src/main/java/com/provismet/cursedspawners/CursedSpawners.java
          test -f src/main/resources/assets/cursed-spawners/textures/entity/spawner_mimic.png
          test "$(find src/main/java -name '*.java' | wc -l)" -eq 22
          test "$(find src/main/resources -name '*.ogg' | wc -l)" -eq 16
          test "$(find src/main/resources -name '*.png' | wc -l)" -eq 24
          grep -q '^mod_version=1.0.0+1.20.1-forge-backport$' gradle.properties

      - name: Commit normalized project
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Normalize Forge 1.20.1 backport source tree'
          git push origin HEAD:agent/forge-compile-fixes

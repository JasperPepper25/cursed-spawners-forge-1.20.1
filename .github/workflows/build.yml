name: Forge 1.20.1 Compile

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source project
        shell: bash
        run: |
          cat ci-project/part-*.txt > project.zip.b64
          base64 --decode project.zip.b64 > project.zip
          mkdir project
          unzip -q project.zip -d project
          test -f project/build.gradle
          # Correct the single hand-carried hunk count in ci-current.patch.
          sed -i 's/^@@ -354,7 +373,13 @@/@@ -354,7 +373,11 @@/' ci-current.patch
          cd project
          git apply ../ci-current.patch
          echo "Reconstructed and patched $(find . -type f | wc -l) project files"
          echo "--- patched source verification ---"
          grep -nE 'getSpawnAABB|getAABB\(x, y, z\)|Optional<Entity> loaded|Entity entity = EntityType.loadEntityRecursive|loadEntityRecursive\(displayed|playAttackSound|forge_version=' \
            src/main/java/com/provismet/cursedspawners/entity/SpawnerMimicEntity.java gradle.properties || true
          echo "--- git status from project directory ---"
          git status --short || true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Compile Forge backport
        working-directory: project
        run: gradle --no-daemon build --stacktrace

      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cursed-spawners-forge-1.20.1
          path: project/build/libs/*.jar
          if-no-files-found: error
